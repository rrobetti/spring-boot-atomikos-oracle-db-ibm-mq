# Force Testcontainers to use the Unix socket strategy.
# On Ubuntu (including when running from IntelliJ), the auto-detection may
# fail even though Docker is installed. Pinning the strategy avoids the
# "Could not find a valid Docker environment" error.
#
# If you use rootless Docker the socket is typically at:
#   /run/user/<UID>/docker.sock
# In that case set DOCKER_HOST=unix:///run/user/<UID>/docker.sock in your
# shell (or IntelliJ run configuration) instead of relying on this file.
docker.client.strategy=org.testcontainers.dockerclient.UnixSocketClientProviderStrategy
