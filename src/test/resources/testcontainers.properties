# Testcontainers configuration
#
# On Ubuntu, Docker may not be auto-detected if the socket lives at a non-default
# path (e.g. rootless Docker uses /run/user/<UID>/docker.sock).
# The integration test's static initialiser probes common socket paths and
# writes "tc.host" to this file automatically on first run.
#
# If auto-detection still fails you can set it manually:
#   tc.host=unix:///run/user/1000/docker.sock
# or export DOCKER_HOST in your shell / IntelliJ run configuration instead.
