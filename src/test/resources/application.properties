# Test Configuration
spring.application.name=spring-boot-atomikos-oracle-db-ibm-mq-test

# These properties will be overridden by @DynamicPropertySource in integration tests
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=testuser
spring.datasource.******

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# IBM MQ Configuration (overridden at runtime)
ibm.mq.queueManager=QM1
ibm.mq.channel=DEV.ADMIN.SVRCONN
ibm.mq.connName=localhost(1414)
ibm.mq.user=admin
ibm.mq.******

# Test admin connection defaults (overridden by @DynamicPropertySource)
test.admin.mq.host=localhost
test.admin.mq.port=1414

# Logging
logging.level.com.example.atomikos=DEBUG
logging.level.org.springframework.jms=DEBUG
logging.level.org.testcontainers=INFO
